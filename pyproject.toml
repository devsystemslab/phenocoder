[project]
name = "phenocoder"
version = "0.1.0"
description = "A machine-learning framework that combines conditional variational autoencoders with spatial graph analysis to learn unsupervised phenotypic embeddings of complex tissue architectures from microscopy images."
requires-python = ">=3.11, <3.13"
dependencies = [
    # Linux: full CUDA stack
    "tensorflow[and-cuda]>=2.19.0; sys_platform == 'linux'",
    # macOS (and any non-Linux): plain TF, no CUDA. Capped at <2.20 because
    # tensorflow-metal 1.2.0 (latest) only supports TF up to 2.19/2.20 — newer
    # TF breaks the Metal plugin load on macOS.
    "tensorflow>=2.19.0,<2.20; sys_platform != 'linux'",
    # Mac GPU acceleration via Metal
    "tensorflow-metal>=1.2.0; sys_platform == 'darwin'",
    "keras",
    "setuptools<81",
    "spatialdata>=0.5.0",
    "matplotlib>=3.10.6",
    "squidpy>=1.8.2",
    "bbknn>=1.6.0",
    "spatialdata-plot>=0.2.12",
    "igraph>=1.0.0",
    "leidenalg>=0.11.0",
    # Pulled in transitively by scanpy, but phenocoder.phenocoder drives umap.UMAP
    # directly (scanpy does not expose the fitted model), so declare it.
    "umap-learn>=0.5.0",
    # Pulled in by tensorflow (which pins tensorboard ~=2.19.0), but Phenocoder.train
    # writes TensorBoard logs itself -- keras.callbacks.TensorBoard plus tf.summary in
    # write_training_plots_to_tensorboard -- and reading them needs the tensorboard CLI.
    # Floor only, no ceiling: tensorflow's own ~= pin sets the upper bound, so adding one
    # here could only conflict with it.
    "tensorboard>=2.19.0",
    # Imported directly by phenocoder modules rather than only reached through another
    # library, so they are declared even though scanpy/spatialdata/squidpy happen to
    # install them today. Without these the package depends on a transitive graph it does
    # not control: an upstream drop would break the import, not just the resolution.
    "pandas>=2.3.3",  # generator, sampling, spatial, reference, phenocoder
    "scikit-learn>=1.9.0",  # PCA, StandardScaler, OneHotEncoder, radius_neighbors_graph
    "scikit-image>=0.26.0",  # skimage.util.montage in utils.plot_reconstructions
    "joblib>=1.5.3",  # reference transform persistence
    "networkx>=3.6.1",  # spatial graph centrality
    "tqdm>=4.68.3",  # progress bars in generator and phenocoder
    "PyYAML>=6.0.3",  # model config read/write
]

[project.optional-dependencies]
dev = [
    "ipdb>=0.13.13",
    "ipython>=8.37.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0",
    "ruff>=0.13.2",
]
docs = [
    "sphinx>=8.0",
    "furo>=2024.8",
    "myst-parser>=4.0",
]

[tool.pytest.ini_options]
# Suppress only known-irreducible warnings from third-party library internals
# that our calls trigger. Message-specific ignores keep our own future
# FutureWarnings/UserWarnings visible.
filterwarnings = [
    # docrep docstring decoration, fires at squidpy import time
    "ignore:.*is not a valid key.*:SyntaxWarning",
    # scanpy legacy_api_wrap dtype coercion
    "ignore:X converted to numpy array with dtype float64:UserWarning",
    # anndata index coercion
    "ignore:Transforming to str index.*:UserWarning",
    # spatialdata table/region handling
    "ignore:Converting .*region.* to categorical dtype.*:UserWarning",
    "ignore:The table is annotating .*which is not present.*:UserWarning",
    # scipy ARPACK matvec, reached via scanpy/sklearn PCA (svd_solver='arpack')
    # on the near-degenerate test matrices. Traced to scipy's _interface.py, not
    # to squidpy: spatial_autocorr runs with n_perms=None and no longer permutes.
    "ignore:divide by zero encountered in matmul:RuntimeWarning",
    "ignore:overflow encountered in matmul:RuntimeWarning",
    "ignore:invalid value encountered in matmul:RuntimeWarning",
    # squidpy interaction-matrix normalization on zero-sum rows. Also suppressed at
    # the call site in spatial.py, so it stays quiet outside pytest too; kept here
    # for any other caller that normalizes an interaction matrix.
    "ignore:invalid value encountered in divide:RuntimeWarning",
    # keras/tensorflow tensor -> numpy conversion internals
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
    # spatialdata -> ome_zarr deprecated downsampler
    "ignore:Call to deprecated class Scaler.*:DeprecationWarning",
]

[tool.ruff]
line-length = 120
[tool.basedpyright]
typeCheckingMode = "basic"
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportArgumentType = false
reportOptionalMemberAccess = false
reportAttributeAccessIssue = false
reportIndexIssue = false
reportOptionalSubscript = false
reportCallIssue = false
reportAssignmentType = false
reportReturnType = false
reportOptionalIterable = false
reportOperatorIssue = false
